<main class="profile-main"><section class="profile-card"><span class="eyebrow">CONTA DO ESTUDANTE</span><h1>Meu perfil</h1><p>Atualize como deseja ser identificado na plataforma.</p><label for="perfil-nome">Nome</label><input id="perfil-nome" maxlength="120" autocomplete="name"><label for="perfil-email">E-mail</label><input id="perfil-email" disabled><p id="profile-message" class="form-message" role="status"></p><button id="profile-save" class="primary-action" type="button">Salvar alterações <span>→</span></button><section class="profile-password" aria-labelledby="password-heading"><div class="profile-password-heading"><h2 id="password-heading">Alterar senha</h2><p>Crie uma nova senha para sua conta. Use pelo menos 8 caracteres.</p></div><label for="perfil-senha">Nova senha</label><input id="perfil-senha" type="password" minlength="8" autocomplete="new-password" placeholder="Digite a nova senha"><label for="perfil-senha-confirmacao">Confirmar nova senha</label><input id="perfil-senha-confirmacao" type="password" minlength="8" autocomplete="new-password" placeholder="Digite a nova senha novamente"><p id="password-message" class="form-message" role="status"></p><button id="password-save" class="primary-action" type="button">Atualizar senha <span>→</span></button></section></section></main>
